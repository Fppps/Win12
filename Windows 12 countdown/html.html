<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12 Countdown</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        /* Prioritize official Windows UI fonts across the entire page */
                        sans: ['"Segoe UI Variable"', '"Segoe UI"', '"Segoe UI Web (West European)"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"Cascadia Code"', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Apply the custom background image and Fluent Design typography */
        body {
            background-image: url('Wallpaper.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0f172a; /* Fallback color */
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Solid Windows Accent Text */
        .text-windows-accent {
            color: #ff5252; /* Updated to a vibrant red */
            text-shadow: 0px 2px 12px rgba(0, 0, 0, 0.5);
        }

        /* Windows 11/12 Mica/Acrylic style Glassmorphism without color gradients */
        .glass-panel {
            background: rgba(20, 20, 20, 0.55);
            backdrop-filter: blur(60px) saturate(180%);
            -webkit-backdrop-filter: blur(60px) saturate(180%);
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.4); /* Removed inset top border */
            animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Subtle crisp drop shadow for countdown numbers */
        .number-glow {
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        @keyframes floatIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-center antialiased">
    <!-- Audio Element -->
    <audio id="tickSound" src="Ticktock.mp3" preload="auto"></audio>

    <!-- Start Overlay (Required to bypass browser autoplay restrictions) -->
    <div id="startOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm transition-opacity duration-700 cursor-pointer">
        <div class="text-center p-8 glass-panel rounded-[7px]">
            <h2 class="text-2xl md:text-4xl font-normal text-white mb-3 animate-pulse">Click anywhere to begin</h2>
            <p class="text-sky-200 text-sm md:text-base opacity-80">Audio initialization required</p>
        </div>
    </div>

    <!-- Separated Header Text -->
    <div class="mb-10 z-10 relative">
        <h1 class="text-4xl md:text-6xl lg:text-7xl font-semibold tracking-tight text-windows-accent drop-shadow-xl">Windows 12: 9H09 countdown</h1>
    </div>

    <!-- Main Content Panel (Roundness set to 7px) -->
    <div class="glass-panel p-6 md:p-12 rounded-[7px] w-[92%] max-w-5xl relative overflow-hidden">
        <!-- Timer Display with individual dark tinted sub-divs (Roundness 7px) -->
        <div class="grid grid-cols-4 gap-3 md:gap-6 justify-center relative z-10">
            
            <div class="bg-black/30 backdrop-blur-md rounded-[7px] p-3 md:p-6 lg:p-8 flex flex-col items-center w-full transition-colors duration-300 hover:bg-black/40">
                <span id="days" class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-light text-white number-glow tabular-nums tracking-tighter">00</span>
                <span class="text-[8px] sm:text-[10px] md:text-sm lg:text-base mt-2 md:mt-4 text-sky-200 tracking-[0.1em] md:tracking-[0.2em] uppercase opacity-75">Days</span>
            </div>
            
            <div class="bg-black/30 backdrop-blur-md rounded-[7px] p-3 md:p-6 lg:p-8 flex flex-col items-center w-full transition-colors duration-300 hover:bg-black/40">
                <span id="hours" class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-light text-white number-glow tabular-nums tracking-tighter">00</span>
                <span class="text-[8px] sm:text-[10px] md:text-sm lg:text-base mt-2 md:mt-4 text-sky-200 tracking-[0.1em] md:tracking-[0.2em] uppercase opacity-75">Hours</span>
            </div>
            
            <div class="bg-black/30 backdrop-blur-md rounded-[7px] p-3 md:p-6 lg:p-8 flex flex-col items-center w-full transition-colors duration-300 hover:bg-black/40">
                <span id="minutes" class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-light text-white number-glow tabular-nums tracking-tighter">00</span>
                <span class="text-[8px] sm:text-[10px] md:text-sm lg:text-base mt-2 md:mt-4 text-sky-200 tracking-[0.1em] md:tracking-[0.2em] uppercase opacity-75">Minutes</span>
            </div>
            
            <div class="bg-black/30 backdrop-blur-md rounded-[7px] p-3 md:p-6 lg:p-8 flex flex-col items-center w-full transition-colors duration-300 hover:bg-black/40">
                <span id="seconds" class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-light text-white number-glow tabular-nums tracking-tighter">00</span>
                <span class="text-[8px] sm:text-[10px] md:text-sm lg:text-base mt-2 md:mt-4 text-sky-200 tracking-[0.1em] md:tracking-[0.2em] uppercase opacity-75">Seconds</span>
            </div>
            
        </div>

        <!-- Release Math Breakdown -->
        <div class="mt-8 pt-6 text-center">
            <p class="text-xs md:text-sm text-sky-200/80 font-sans tracking-wide leading-relaxed">
                <span class="text-white font-semibold">TARGET WINDOW:</span> SEPT 5 - 19, 2026<br>
                <span class="text-white font-semibold">ETA CALCULATION:</span> 1.5H (FINALIZING) + 1.5H (5TH BUILD) + 120H (5 DAYS GITHUB SYNC)
            </p>
        </div>
    </div>

    <script>
        // --- Windows 9H09 Target Release Date ---
        // Calculated as: Current time (Sept 1, 2026, 6:31 PM EDT) + 123 hours total
        // Target Date: September 6, 2026 at 9:31:01 PM EDT
        const targetDate = new Date("2026-09-06T21:31:01-04:00").getTime();
        // --------------------------------------

        let timerInterval = null;
        let soundEnabled = false;

        const tickSound = document.getElementById('tickSound');
        const startOverlay = document.getElementById('startOverlay');
        
        // DOM Elements
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        // Function to format numbers to always be 2 digits
        const formatTime = (time) => String(time).padStart(2, '0');

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Stop timer if it hits zero
            if (distance <= 0) {
                clearInterval(timerInterval);
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                return;
            }

            // Time calculations
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result with padding
            daysEl.innerText = formatTime(days);
            hoursEl.innerText = formatTime(hours);
            minutesEl.innerText = formatTime(minutes);
            
            // Play sound only when the second changes
            const formattedSeconds = formatTime(seconds);
            if (secondsEl.innerText !== formattedSeconds) {
                if (soundEnabled && tickSound) {
                    tickSound.currentTime = 0; // Reset sound to start
                    tickSound.play().catch(e => console.log("Audio play blocked", e));
                }
            }
            secondsEl.innerText = formattedSeconds;
        }

        // Handle user interaction to enable audio and hide overlay
        startOverlay.addEventListener('click', () => {
            soundEnabled = true;
            
            // Hide the overlay smoothly
            startOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                startOverlay.style.display = 'none';
            }, 700);
        });

        // Initialize the timer immediately on load so refreshing doesn't reset it
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
